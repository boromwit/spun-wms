<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1216">
<script>
  // ตั้งธีมก่อนเรนเดอร์ (กันจอกะพริบ): ใช้ค่าที่เลือกไว้ ถ้าไม่มีให้ตามระบบเครื่อง
  (function () {
    var t = null;
    try { t = localStorage.getItem('wms_theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.content = t === 'light' ? '#f3f5f8' : '#0f1216';
  })();
</script>
<title>WMS คลังผ้าม้วน SPUN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- ทุกครั้งที่แก้ไฟล์ js/css ให้เปลี่ยนเลข ?v= ทุกบรรทัดเป็นค่าใหม่ ไม่งั้นเบราว์เซอร์อาจใช้ไฟล์เก่าปนไฟล์ใหม่ (ทำให้หน้ารับเข้าพัง) -->

</head>

      <button class="icon-btn theme-btn" data-theme-toggle aria-label="สลับโหมดสว่าง/มืด"></button>
    </div>
